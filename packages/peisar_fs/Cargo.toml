[package]
name = "peisar_fs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
peisar_log = { workspace = true }
napi-derive = { workspace = true }
napi = { workspace = true, optional = true }

[features]
default = []
# Enable napi-rs derive macros (for Node.js builds).
napi = ["dep:napi", "peisar_log/napi"]

[lib]
name = "peisar_fs"
path = "src/lib.rs"
