[package]
name = "peisar_log"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Colored, formatted logging utilities for the Peisar project"
readme = "README.md"

[dependencies]
colored = { workspace = true }
napi-derive = { workspace = true }
napi = { workspace = true, optional = true }

[features]
default = []
# Enable napi-rs derive macros (for Node.js builds).
napi = ["dep:napi"]

[lib]
name = "peisar_log"
path = "src/lib.rs"
