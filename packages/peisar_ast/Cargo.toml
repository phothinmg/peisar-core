[package]
name = "peisar_ast"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"


[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
peisar_frontmatter = { workspace = true }
# napi-rs support — enabled when building for Node.js via the `peisar` main crate.
# Not used directly in this crate; the cfg_attr annotations are inert without
# this feature.
napi = { version = "3", optional = true, default-features = false, features = [
    "napi8",
] }

[features]
default = []
# Enable napi-rs derive macros on all public types.
napi = ["dep:napi"]

[lib]
name = "peisar_ast"
path = "src/lib.rs"
