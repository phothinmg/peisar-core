[package]
name = "peisar_ast"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A lossless Markdown AST parser with source-span tracking, GFM extensions, Kramdown block attributes, and a visitor-based transformation API"
readme = "README.md"


[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
peisar_frontmatter = { workspace = true }
napi-derive = { workspace = true }
napi = { workspace = true, optional = true }

[features]
default = []
# Enable napi-rs derive macros on all public types.
napi = ["dep:napi"]

[lib]
name = "peisar_ast"
path = "src/lib.rs"
