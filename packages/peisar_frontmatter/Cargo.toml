[package]
name = "peisar_frontmatter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Parse optional YAML front matter from Markdown documents and deserialize it into any serde-enabled type"
readme = "README.md"

[dependencies]
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
napi-derive = { workspace = true }
napi = { workspace = true, optional = true }

[features]
default = []
# Enable napi-rs derive macros (for Node.js builds).
napi = ["dep:napi"]

[lib]
name = "peisar_frontmatter"
path = "src/lib.rs"
