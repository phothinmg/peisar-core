[workspace]
resolver = "3"
members = [
    "packages/peisar_ast",
    "packages/peisar_frontmatter",
    "packages/peisar_fs",
    "packages/peisar_html",
    "packages/peisar_log",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Pho Thin Maung <phothinmg@disroot.org>"]
repository = "https://github.com/phothinmg/peisar-core"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9"
colored = "2"
serde_json = "1.0"
peisar_log = { path = "./packages/peisar_log" }
peisar_frontmatter = { path = "./packages/peisar_frontmatter" }
peisar_ast = { path = "./packages/peisar_ast" }
napi-derive = "3"
# napi-rs support — enabled when building for Node.js via the `peisar` main crate.
# Not used directly in this crate; the cfg_attr annotations are inert without
# this feature.
napi = { version = "3", default-features = false, features = ["napi8"] }
